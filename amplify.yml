version: 1
frontend:
  phases:
    preBuild:
      commands:
        - |
          if command -v bun >/dev/null 2>&1; then
            bun install --frozen-lockfile
          elif command -v yarn >/dev/null 2>&1; then
            yarn install
          else
            npm install
          fi
    build:
      commands:
        - |
          : > .env.production

          env | grep -E '^NEXT_PUBLIC_' >> .env.production || true

          required_server_vars="PRIVY_APP_SECRET DATABASE_URL"
          for name in $required_server_vars; do
            value="$(printenv "$name")"
            if [ -z "$value" ]; then
              echo "Missing required server runtime env var: $name"
              exit 1
            fi
            printf '%s=%s\n' "$name" "$value" >> .env.production
          done

          optional_server_vars="GOOGLE_GENERATIVE_AI_API_KEY OPENAI_API_KEY BITREFILL_API_KEY BITREFILL_CLIENT_ID BITREFILL_MCP_URL BITREFILL_AFFILIATE_CODE CIRCLE_BUYER_PRIVATE_KEY CIRCLE_GATEWAY_WALLET_ADDRESS CIRCLE_USDC_ADDRESS SOLANA_AGENT_PRIVATE_KEY SOLANA_SELLER_PRIVATE_KEY SOLANA_BILL_RECEIVER SOLANA_FEE_RECIPIENT PAY_KIT_MPP_SECRET FLASH_SOLANA_RPC FLASH_ER_RPC ZERO_X_API_KEY XSTOCKS_API_KEY FUZE_API_KEY FUZE_API_SECRET FUZE_API_BASE FUZE_WEBHOOK_SECRET CREDIBLE_FINANCE_API_KEY CREDIBLE_FINANCE_API_SECRET RIPPLE_ODL_CLIENT_ID RIPPLE_ODL_CLIENT_SECRET RIPPLE_ODL_BASE_URL RIPPLE_ODL_TOKEN_URL RIPPLE_ODL_WEBHOOK_SECRET BLUVFI_XRPL_API_URL BLUVFI_XRPL_API_KEY BLUVFI_XRPL_WEBHOOK_SECRET DOMA_API_KEY DOMA_API_BASE DOMA_GRAPHQL_URL DOMA_ENV GRAIL_API_KEY GRAIL_PARTNER_PRIVATE_KEY GRAIL_PARTNER_ID NOSANA_API_KEY NOSANA_API_BASE ROASTER_API_KEY ROASTER_API_BASE SPHEREPAY_API_KEY AI_PROVIDER QWEN_API_KEY QWEN_MODEL OPENAI_MODEL"
          for name in $optional_server_vars; do
            value="$(printenv "$name")"
            if [ -n "$value" ]; then
              printf '%s=%s\n' "$name" "$value" >> .env.production
            fi
          done

          if command -v bun >/dev/null 2>&1; then
            bun run build
          elif command -v yarn >/dev/null 2>&1; then
            yarn build
          else
            npm run build
          fi
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
